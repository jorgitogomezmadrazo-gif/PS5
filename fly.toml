# fly.toml app configuration file generated for alabamahealthcenter on 2026-11-21T03:22:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'alabamahealthcenter'
primary_region = 'lax'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
